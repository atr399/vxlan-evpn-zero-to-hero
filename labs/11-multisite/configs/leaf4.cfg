hostname leaf4

feature ospf
feature bgp
feature nv overlay
nv overlay evpn
feature interface-vlan
feature vn-segment-vlan-based
feature lacp

fabric forwarding anycast-gateway-mac 0000.2222.3333

route-map ALL_ROUTES permit 10

vlan 1,10,20,30,40,50,60,98-99
vlan 10
  name TenantA-Web
  vn-segment 10010
vlan 20
  name TenantA-App
  vn-segment 10020
vlan 30
  name TenantB-Web
  vn-segment 10030
vlan 40
  name TenantB-App
  vn-segment 10040
vlan 50
  name TenantA-L2Out
  vn-segment 10050
vlan 60
  name TenantA-Site2
  vn-segment 10060
vlan 98
  name L3VNI-TenantB
  vn-segment 50002
vlan 99
  name L3VNI-TenantA
  vn-segment 50001

vrf context Tenant-A
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
    route-target import 65001:50002
    route-target import 65001:50002 evpn

vrf context Tenant-B
  vni 50002
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
    route-target import 65001:50001
    route-target import 65001:50001 evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.24/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP NVE source
  ip address 10.0.1.24/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Vlan10
  description Tenant-A VLAN 10 anycast gateway
  no shutdown
  vrf member Tenant-A
  no ip redirects
  ip address 10.100.10.1/24
  no ipv6 redirects
  fabric forwarding mode anycast-gateway

interface Vlan20
  description Tenant-A VLAN 20 anycast gateway
  no shutdown
  vrf member Tenant-A
  no ip redirects
  ip address 10.100.20.1/24
  no ipv6 redirects
  fabric forwarding mode anycast-gateway

interface Vlan30
  description Tenant-B VLAN 30 anycast gateway
  no shutdown
  vrf member Tenant-B
  no ip redirects
  ip address 10.200.10.1/24
  no ipv6 redirects
  fabric forwarding mode anycast-gateway

interface Vlan40
  description Tenant-B VLAN 40 anycast gateway
  no shutdown
  vrf member Tenant-B
  no ip redirects
  ip address 10.200.20.1/24
  no ipv6 redirects
  fabric forwarding mode anycast-gateway

interface Vlan50
  description Tenant-A VLAN 50 anycast gateway (L2Out)
  no shutdown
  vrf member Tenant-A
  ip address 10.100.50.1/24
  fabric forwarding mode anycast-gateway

interface Vlan60
  description Tenant-A VLAN 60 anycast gateway (Site2 native)
  no shutdown
  vrf member Tenant-A
  no ip redirects
  ip address 10.100.30.1/24
  no ipv6 redirects
  fabric forwarding mode anycast-gateway

interface Vlan98
  description L3VNI carrier for Tenant-B
  no shutdown
  vrf member Tenant-B
  no ip redirects
  ip forward
  no ipv6 redirects

interface Vlan99
  description L3VNI carrier for Tenant-A
  no shutdown
  vrf member Tenant-A
  no ip redirects
  ip forward
  no ipv6 redirects

interface Ethernet1/1
  description to spine5 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.10.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/3
  description to host5 (VLAN 60, Site2 Tenant-A)
  switchport access vlan 60

interface nve1
  no shutdown
  description VXLAN tunnel endpoint
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 10020
    ingress-replication protocol bgp
  member vni 10030
    ingress-replication protocol bgp
  member vni 10040
    ingress-replication protocol bgp
  member vni 10050
    ingress-replication protocol bgp
  member vni 10060
    ingress-replication protocol bgp
  member vni 50001 associate-vrf
  member vni 50002 associate-vrf

router ospf UNDERLAY
  router-id 10.0.0.24

router bgp 65001
  router-id 10.0.0.24
  address-family l2vpn evpn
    advertise-pip
  neighbor 10.0.0.15
    remote-as 65001
    update-source loopback0
    description to spine5 (Site2 spine RR)
    address-family l2vpn evpn
      send-community
      send-community extended
  vrf Tenant-A
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map ALL_ROUTES
      maximum-paths ibgp 2
  vrf Tenant-B
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map ALL_ROUTES
      maximum-paths ibgp 2

evpn
  vni 10010 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10020 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10030 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10040 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10050 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10060 l2
    rd auto
    route-target import auto
    route-target export auto
