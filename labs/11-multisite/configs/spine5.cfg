hostname spine5

feature ospf
feature bgp
feature nv overlay
nv overlay evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.15/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description to leaf4 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.10.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/2
  description to bgw2 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.9.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

router ospf UNDERLAY
  router-id 10.0.0.15

router bgp 65001
  router-id 10.0.0.15
  address-family l2vpn evpn
    retain route-target all
  neighbor 10.0.0.24
    remote-as 65001
    update-source loopback0
    description to leaf4 (Site2)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.32
    remote-as 65001
    update-source loopback0
    description to bgw2 (Site2 BGW)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
