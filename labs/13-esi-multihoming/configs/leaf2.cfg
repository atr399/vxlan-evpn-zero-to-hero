! Session 13 - ESI Multihoming (leaf2) - UNTESTED DESIGN
! Precondition: clean chain 01 -> 05b (NO Session 6 vPC applied!)
! Step 0 gate: if 'feature evpn esi multihoming' is rejected, STOP (doc-only).
feature lacp
feature evpn esi multihoming
evpn esi multihoming

interface port-channel 10
  description host1 bond - ESI segment (vPC-less)
  switchport mode trunk
  switchport trunk native vlan 10
  switchport trunk allowed vlan 10
  ethernet-segment 2001
    system-mac 0000.0000.2001
  mtu 9216

interface Ethernet1/6
  description to host1 eth2 (ESI member)
  switchport mode trunk
  switchport trunk native vlan 10
  switchport trunk allowed vlan 10
  mtu 9216
  channel-group 10 mode active
  no shutdown
