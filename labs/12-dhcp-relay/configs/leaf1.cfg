! Session 12 - DHCP Relay in the overlay (leaf1) - UNTESTED DESIGN
! Base: Session 07 end-state (Model A chain 01->07)
feature dhcp
ip dhcp relay
ip dhcp relay information option
ip dhcp relay information option vpn

interface loopback99
  description Tenant-A DHCP relay giaddr (UNIQUE per leaf)
  vrf member Tenant-A
  ip address 10.99.99.1/32

vrf context Tenant-A
  address-family ipv4 unicast

interface Vlan10
  ip dhcp relay address 10.99.99.10
  ip dhcp relay source-interface loopback99

! leaf1 only: advertise the server subnet reachability is via L3Out /
! or host the dhcp-server on a dedicated access port - see docs/12.
