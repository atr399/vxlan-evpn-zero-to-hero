hostname spine1

feature ospf
feature bgp
feature nv overlay
nv overlay evpn
feature interface-vlan
feature vn-segment-vlan-based

fabric forwarding anycast-gateway-mac 0000.2222.3333

evpn multisite border-gateway 1
  delay-restore time 30

vlan 1,10,20,30,40,50,60,98-99
vlan 10
  name TenantA-Web
  vn-segment 10010
vlan 20
  name TenantA-App
  vn-segment 10020
vlan 30
  name TenantB-Web
  vn-segment 10030
vlan 40
  name TenantB-App
  vn-segment 10040
vlan 50
  name TenantA-L2Out
  vn-segment 10050
vlan 60
  name TenantA-Site2
  vn-segment 10060
vlan 98
  name L3VNI-TenantB
  vn-segment 50002
vlan 99
  name L3VNI-TenantA
  vn-segment 50001

vrf context Tenant-A
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
    route-target import 65000:50002
    route-target import 65000:50002 evpn
vrf context Tenant-B
  vni 50002
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
    route-target import 65000:50001
    route-target import 65000:50001 evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.11/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description Multi-Site VTEP (PIP)
  ip address 10.0.1.11/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback2
  description Multi-Site shared VTEP (VIP)
  ip address 10.0.2.100/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Vlan98
  description L3VNI carrier for Tenant-B
  no shutdown
  vrf member Tenant-B
  no ip redirects
  ip forward
  no ipv6 redirects

interface Vlan99
  description L3VNI carrier for Tenant-A
  no shutdown
  vrf member Tenant-A
  no ip redirects
  ip forward
  no ipv6 redirects

interface Ethernet1/1
  description to leaf1 Eth1/1 (fabric)
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.1.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  evpn multisite fabric-tracking

interface Ethernet1/2
  description to leaf2 Eth1/1 (fabric)
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.2.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  evpn multisite fabric-tracking

interface Ethernet1/3
  description DCI to spine5 (Site2 BGW)
  no switchport
  mtu 9216
  no shutdown
  ip address 192.168.100.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  evpn multisite dci-tracking

interface nve1
  no shutdown
  description Multi-Site VTEP
  host-reachability protocol bgp
  source-interface loopback1
  multisite border-gateway interface loopback2
  member vni 10010
    ingress-replication protocol bgp
  member vni 10020
    ingress-replication protocol bgp
  member vni 10030
    ingress-replication protocol bgp
  member vni 10040
    ingress-replication protocol bgp
  member vni 10050
    ingress-replication protocol bgp
  member vni 10060
    ingress-replication protocol bgp
  member vni 50001 associate-vrf
  member vni 50002 associate-vrf

router ospf UNDERLAY
  router-id 10.0.0.11

router bgp 65000
  router-id 10.0.0.11
  address-family l2vpn evpn
    advertise-pip
  neighbor 10.0.0.21
    remote-as 65000
    update-source loopback0
    description to leaf1 (RR client)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.22
    remote-as 65000
    update-source loopback0
    description to leaf2 (RR client)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 192.168.100.1
    remote-as 65001
    description eBGP-EVPN DCI to spine5 (Site2)
    address-family l2vpn evpn
      send-community
      send-community extended
      rewrite-evpn-rt-asn

evpn
  vni 10010 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10020 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10030 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10040 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10050 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10060 l2
    rd auto
    route-target import auto
    route-target export auto
