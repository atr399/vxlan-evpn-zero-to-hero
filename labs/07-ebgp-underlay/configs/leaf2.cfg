no router ospf UNDERLAY
no router bgp 65000

hostname leaf2

feature bgp
feature nv overlay
nv overlay evpn
feature interface-vlan
feature vn-segment-vlan-based
feature vpc
feature lacp

fabric forwarding anycast-gateway-mac 0000.2222.3333

route-map ALL_ROUTES permit 10

vlan 10
  name TenantA-Web
  vn-segment 10010

vlan 20
  name TenantA-App
  vn-segment 10020

vlan 30
  name TenantB-Web
  vn-segment 10030

vlan 40
  name TenantB-App
  vn-segment 10040

vlan 99
  name L3VNI-TenantA
  vn-segment 50001

vlan 98
  name L3VNI-TenantB
  vn-segment 50002

vrf context Tenant-A
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target import 65000:50001
    route-target export 65000:50001
    route-target import 65000:50001 evpn
    route-target export 65000:50001 evpn
    route-target import 65000:50002
    route-target import 65000:50002 evpn

vrf context Tenant-B
  vni 50002
  rd auto
  address-family ipv4 unicast
    route-target import 65000:50002
    route-target export 65000:50002
    route-target import 65000:50002 evpn
    route-target export 65000:50002 evpn
    route-target import 65000:50001
    route-target import 65000:50001 evpn

vpc domain 10
  peer-switch
  role priority 2
  peer-keepalive destination 10.20.0.0 source 10.20.0.1 vrf default
  delay restore 150
  peer-gateway
  ipv6 nd synchronize
  ip arp synchronize

interface loopback0
  description Router-ID source
  ip address 10.0.0.22/32

interface loopback1
  description VTEP NVE source
  ip address 10.0.1.22/32
  ip address 10.0.1.100/32 secondary

interface Vlan10
  description Tenant-A VLAN 10 anycast gateway
  no shutdown
  vrf member Tenant-A
  ip address 10.100.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan20
  description Tenant-A VLAN 20 anycast gateway
  no shutdown
  vrf member Tenant-A
  ip address 10.100.20.1/24
  fabric forwarding mode anycast-gateway

interface Vlan30
  description Tenant-B VLAN 30 anycast gateway
  no shutdown
  vrf member Tenant-B
  ip address 10.200.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan40
  description Tenant-B VLAN 40 anycast gateway
  no shutdown
  vrf member Tenant-B
  ip address 10.200.20.1/24
  fabric forwarding mode anycast-gateway

interface Vlan99
  description L3VNI carrier for Tenant-A
  no shutdown
  vrf member Tenant-A
  ip forward
  no ip redirects

interface Vlan98
  description L3VNI carrier for Tenant-B
  no shutdown
  vrf member Tenant-B
  ip forward
  no ip redirects

interface port-channel100
  description vPC peer-link
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1,10,20,30,40,98,99
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/4
  description vPC peer-link member
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1,10,20,30,40,98,99
  channel-group 100 mode active
  no shutdown

interface Ethernet1/5
  description vPC peer-keepalive link
  no switchport
  mtu 1500
  no shutdown
  ip address 10.20.0.1/31

interface Ethernet1/1
  description to spine1 Eth1/2 (eBGP underlay)
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.2.1/31

interface Ethernet1/2
  description to spine2 Eth1/2 (eBGP underlay)
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.4.1/31

interface Ethernet1/3
  description to host2 (VLAN 30 access)
  switchport
  switchport mode access
  switchport access vlan 30
  no shutdown

interface port-channel10
  description host1 bond - vPC 10
  switchport
  switchport mode trunk
  switchport trunk native vlan 10
  switchport trunk allowed vlan 10
  spanning-tree port type edge trunk
  mtu 9216
  vpc 10

interface Ethernet1/6
  description to host1 bond (vPC 10 member, second leg)
  switchport
  switchport mode trunk
  switchport trunk native vlan 10
  switchport trunk allowed vlan 10
  channel-group 10 mode active
  no shutdown

interface port-channel10
  description host1 bond - vPC 10
  switchport
  switchport mode trunk
  switchport trunk native vlan 10
  switchport trunk allowed vlan 10
  spanning-tree port type edge trunk
  mtu 9216
  vpc 10

interface nve1
  description VXLAN tunnel endpoint
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 10020
    ingress-replication protocol bgp
  member vni 10030
    ingress-replication protocol bgp
  member vni 10040
    ingress-replication protocol bgp
  member vni 50001 associate-vrf
  member vni 50002 associate-vrf

router bgp 65011
  router-id 10.0.0.22
  address-family ipv4 unicast
    redistribute direct route-map ALL_ROUTES
    maximum-paths 2
  address-family l2vpn evpn
    advertise-pip
    maximum-paths 2
  neighbor 10.10.2.0
    remote-as 65001
    description to spine1 (underlay + EVPN)
    address-family ipv4 unicast
      send-community
      send-community extended
      allowas-in 1
    address-family l2vpn evpn
      send-community
      send-community extended
      allowas-in 1
  neighbor 10.10.4.0
    remote-as 65002
    description to spine2 (underlay + EVPN)
    address-family ipv4 unicast
      send-community
      send-community extended
      allowas-in 1
    address-family l2vpn evpn
      send-community
      send-community extended
      allowas-in 1
  vrf Tenant-A
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map ALL_ROUTES
      maximum-paths ibgp 2
  vrf Tenant-B
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map ALL_ROUTES
      maximum-paths ibgp 2

evpn
  vni 10010 l2
    rd auto
    route-target import 65000:10010
    route-target export 65000:10010
  vni 10020 l2
    rd auto
    route-target import 65000:10020
    route-target export 65000:10020
  vni 10030 l2
    rd auto
    route-target import 65000:10030
    route-target export 65000:10030
  vni 10040 l2
    rd auto
    route-target import 65000:10040
    route-target export 65000:10040
