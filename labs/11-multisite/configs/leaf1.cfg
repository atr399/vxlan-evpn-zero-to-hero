hostname leaf1

feature ospf
feature bgp
feature nv overlay
nv overlay evpn
feature interface-vlan
feature vn-segment-vlan-based
feature vpc
feature lacp

fabric forwarding anycast-gateway-mac 0000.2222.3333


ip prefix-list TENANT_A_EXPORT seq 10 permit 10.100.10.0/24
ip prefix-list TENANT_A_EXPORT seq 20 permit 10.100.20.0/24
ip prefix-list TENANT_A_EXPORT seq 30 permit 10.100.50.0/24
ip prefix-list TENANT_A_EXPORT seq 40 permit 10.200.10.0/24
ip prefix-list TENANT_A_EXPORT seq 50 permit 10.200.20.0/24
ip prefix-list TENANT_A_EXPORT seq 60 permit 10.100.30.0/24

route-map EXPORT_TO_L3OUT permit 10
  match ip address prefix-list TENANT_A_EXPORT

route-map ALL_ROUTES permit 10

vlan 10
  name TenantA-Web
  vn-segment 10010

vlan 20
  name TenantA-App
  vn-segment 10020

vlan 30
  name TenantB-Web
  vn-segment 10030

vlan 40
  name TenantB-App
  vn-segment 10040

vlan 50
  name TenantA-L2Out
  vn-segment 10050

vlan 99
  name L3VNI-TenantA
  vn-segment 50001

vlan 98
  name L3VNI-TenantB
  vn-segment 50002

vrf context Tenant-A
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
    route-target import 65000:50002
    route-target import 65000:50002 evpn

vrf context Tenant-B
  vni 50002
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
    route-target import 65000:50001
    route-target import 65000:50001 evpn

vpc domain 10
  peer-switch
  role priority 1
  peer-keepalive destination 10.20.0.1 source 10.20.0.0 vrf default
  delay restore 150
  peer-gateway
  ipv6 nd synchronize
  ip arp synchronize

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.21/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP NVE source
  ip address 10.0.1.21/32
  ip address 10.0.1.100/32 secondary
  ip router ospf UNDERLAY area 0.0.0.0

interface Vlan10
  description Tenant-A VLAN 10 anycast gateway
  no shutdown
  vrf member Tenant-A
  ip address 10.100.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan20
  description Tenant-A VLAN 20 anycast gateway
  no shutdown
  vrf member Tenant-A
  ip address 10.100.20.1/24
  fabric forwarding mode anycast-gateway

interface Vlan50
  description Tenant-A VLAN 50 anycast gateway (L2Out)
  no shutdown
  vrf member Tenant-A
  ip address 10.100.50.1/24
  fabric forwarding mode anycast-gateway

interface Vlan30
  description Tenant-B VLAN 30 anycast gateway
  no shutdown
  vrf member Tenant-B
  ip address 10.200.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan40
  description Tenant-B VLAN 40 anycast gateway
  no shutdown
  vrf member Tenant-B
  ip address 10.200.20.1/24
  fabric forwarding mode anycast-gateway

interface Vlan99
  description L3VNI carrier for Tenant-A
  no shutdown
  vrf member Tenant-A
  ip forward
  no ip redirects

interface Vlan98
  description L3VNI carrier for Tenant-B
  no shutdown
  vrf member Tenant-B
  ip forward
  no ip redirects

interface port-channel100
  description vPC peer-link
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1,10,20,30,40,50
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/4
  description vPC peer-link member
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1,10,20,30,40,50
  channel-group 100 mode active
  no shutdown

interface Ethernet1/5
  description vPC peer-keepalive link
  no switchport
  mtu 1500
  no shutdown
  ip address 10.20.0.0/31

interface Ethernet1/1
  description to spine1 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.1.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/2
  description to spine2 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.3.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/3
  description to host1 bond (vPC 10 member)
  switchport
  switchport mode trunk
  switchport trunk native vlan 10
  switchport trunk allowed vlan 10
  channel-group 10 mode active
  no shutdown

interface port-channel10
  description host1 bond - vPC 10
  switchport
  switchport mode trunk
  switchport trunk native vlan 10
  switchport trunk allowed vlan 10
  spanning-tree port type edge trunk
  mtu 9216
  vpc 10


interface Ethernet1/6
  description L2Out trunk to external switch
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 50
  no shutdown


interface Ethernet1/7
  description L3Out to extrouter (AS 65100) in Tenant-A
  no switchport
  vrf member Tenant-A
  ip address 192.0.2.1/31
  mtu 9216
  no shutdown

interface nve1
  description VXLAN tunnel endpoint
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 10020
    ingress-replication protocol bgp
  member vni 10030
    ingress-replication protocol bgp
  member vni 10040
    ingress-replication protocol bgp
  member vni 10050
    ingress-replication protocol bgp
  member vni 50001 associate-vrf
  member vni 50002 associate-vrf

router ospf UNDERLAY
  router-id 10.0.0.21

router bgp 65000
  router-id 10.0.0.21
  address-family l2vpn evpn
    advertise-pip
  neighbor 10.0.0.11
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.0.0.12
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
  vrf Tenant-A
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map ALL_ROUTES
      maximum-paths ibgp 2
    neighbor 192.0.2.0
      remote-as 65100
      description L3Out eBGP to extrouter
      address-family ipv4 unicast
        route-map EXPORT_TO_L3OUT out
        send-community
        send-community extended
  vrf Tenant-B
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map ALL_ROUTES
      maximum-paths ibgp 2

evpn
  vni 10010 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10020 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10030 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10040 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10050 l2
    rd auto
    route-target import auto
    route-target export auto
