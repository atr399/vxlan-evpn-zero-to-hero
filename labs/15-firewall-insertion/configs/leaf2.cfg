! Session 15 (leaf2) - UNTESTED DESIGN - firewall arms + VRF sandwich
! Base: chain 01->05a (two tenants, NO 05b leak). Push this after 05a.
vlan 91
  name TenantA-FW-arm
  vn-segment 10091
vlan 92
  name TenantB-FW-arm
  vn-segment 10092

interface Vlan91
  no shutdown
  vrf member Tenant-A
  ip address 10.100.91.1/24
  fabric forwarding mode anycast-gateway

interface Vlan92
  no shutdown
  vrf member Tenant-B
  ip address 10.200.92.1/24
  fabric forwarding mode anycast-gateway

interface nve1
  member vni 10091
    suppress-arp
    ingress-replication protocol bgp
  member vni 10092
    suppress-arp
    ingress-replication protocol bgp

evpn
  vni 10091 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10092 l2
    rd auto
    route-target import auto
    route-target export auto

! THE SANDWICH - replaces the 05b leak with policy-enforced transit:
vrf context Tenant-A
  ip route 10.200.10.0/24 10.100.91.10
vrf context Tenant-B
  ip route 10.100.10.0/24 10.200.92.10
