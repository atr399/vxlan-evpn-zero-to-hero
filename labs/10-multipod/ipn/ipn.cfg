! IPN (Inter-Pod Network) cEOS startup config
! Role: route the underlay between Pod1 and Pod2 spines.
! Each link is a /31 point-to-point. OSPF advertises spine loopbacks across pods.
! MTU 9214 to carry VXLAN-encapsulated frames between pods (default fabric MTU 9000 + headers).

hostname ipn
!
no aaa root
no enable password
!
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
interface Ethernet1
   description to Pod1 spine1 Eth1/3
   no switchport
   mtu 9214
   ip address 10.30.1.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description to Pod1 spine2 Eth1/3
   no switchport
   mtu 9214
   ip address 10.30.2.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description to Pod2 spine3 Eth1/3
   no switchport
   mtu 9214
   ip address 10.30.3.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet4
   description to Pod2 spine4 Eth1/3
   no switchport
   mtu 9214
   ip address 10.30.4.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   ip address 10.30.0.1/32
   ip ospf area 0.0.0.0
!
interface Management0
   ip address 172.20.20.30/24
!
ip routing
!
router ospf 1
   router-id 10.30.0.1
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   no passive-interface Ethernet3
   no passive-interface Ethernet4
   max-lsa 12000
!
end
