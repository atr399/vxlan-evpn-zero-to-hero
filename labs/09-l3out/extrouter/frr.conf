! FRR config for extrouter - the external BGP router for Session 9 L3Out.
!
! Topology:
!   eth1: link to leaf1 (192.0.2.1/31, peer is 192.0.2.0)
!   eth2: link to host_internet (203.0.113.1/24)
!
! AS 65100. Establishes eBGP with leaf1 (AS 65000), advertises 203.0.113.0/24.

hostname extrouter
!
interface eth1
 ip address 192.0.2.1/31
!
interface eth2
 ip address 203.0.113.1/24
!
router bgp 65100
 bgp router-id 203.0.113.1
 no bgp default ipv4-unicast
 neighbor 192.0.2.0 remote-as 65000
 neighbor 192.0.2.0 description leaf1-Tenant-A
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 192.0.2.0 activate
  neighbor 192.0.2.0 send-community both
 exit-address-family
!
ip route 203.0.113.0/24 Null0
!
line vty
!
