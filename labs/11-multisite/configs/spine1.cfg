hostname spine1

feature ospf
feature bgp
feature nv overlay
nv overlay evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.11/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description to leaf1 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.1.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/2
  description to leaf2 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.2.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/3
  description to IPN Eth1 (inter-pod underlay)
  no switchport
  mtu 9214
  no shutdown
  ip address 10.30.1.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/4
  description to bgw1 Eth1/1 (Site1 BGW)
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.7.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

router ospf UNDERLAY
  router-id 10.0.0.11

router bgp 65000
  router-id 10.0.0.11
  address-family l2vpn evpn
    retain route-target all
  neighbor 10.0.0.21
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.22
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.13
    remote-as 65000
    update-source loopback0
    description to spine3 (Pod2)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.14
    remote-as 65000
    update-source loopback0
    description to spine4 (Pod2)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.31
    remote-as 65000
    update-source loopback0
    description to bgw1 (Site1 BGW)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
