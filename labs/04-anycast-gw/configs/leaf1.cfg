hostname leaf1

feature ospf
feature bgp
feature nv overlay
nv overlay evpn
feature interface-vlan
feature vn-segment-vlan-based

fabric forwarding anycast-gateway-mac 0000.2222.3333

vlan 10
  name TenantA-Web
  vn-segment 10010

vlan 20
  name TenantA-App
  vn-segment 10020

vlan 99
  name L3VNI-TenantA
  vn-segment 50001

vrf context Tenant-A
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.21/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP NVE source
  ip address 10.0.1.21/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Vlan10
  description SVI for VLAN 10 (anycast gateway)
  no shutdown
  vrf member Tenant-A
  ip address 10.100.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan20
  description SVI for VLAN 20 (anycast gateway)
  no shutdown
  vrf member Tenant-A
  ip address 10.100.20.1/24
  fabric forwarding mode anycast-gateway

interface Vlan99
  description SVI for L3VNI 50001
  no shutdown
  vrf member Tenant-A
  ip forward
  no ip redirects

interface Ethernet1/1
  description to spine1 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.1.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/2
  description to spine2 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.3.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/3
  description to host1 (VLAN 10)
  switchport
  switchport mode access
  switchport access vlan 10
  no shutdown

interface nve1
  description VXLAN tunnel endpoint
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 10020
    ingress-replication protocol bgp
  member vni 50001 associate-vrf

router ospf UNDERLAY
  router-id 10.0.0.21

router bgp 65000
  router-id 10.0.0.21
  address-family l2vpn evpn
    advertise-pip
  neighbor 10.0.0.11
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.0.0.12
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
  vrf Tenant-A
    address-family ipv4 unicast
      advertise l2vpn evpn

evpn
  vni 10010 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10020 l2
    rd auto
    route-target import auto
    route-target export auto
