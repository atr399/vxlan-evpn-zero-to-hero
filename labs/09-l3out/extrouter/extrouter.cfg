! cEOS startup config for extrouter (Session 9)
! AS 65100, dual eBGP sessions to leaf1 and leaf2, ECMP load-balancing

hostname extrouter
!
no aaa root
no enable password
!
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
interface Ethernet1
   description to leaf1 Eth1/7
   no switchport
   ip address 192.0.2.0/31
!
interface Ethernet2
   description to leaf2 Eth1/7
   no switchport
   ip address 192.0.2.2/31
!
interface Ethernet3
   description to host_internet
   no switchport
   ip address 203.0.113.1/24
!
interface Management0
   ip address 172.20.20.20/24
!
ip routing
!
ip route 203.0.113.0/24 Null0
!
router bgp 65100
   router-id 203.0.113.1
   maximum-paths 2 ecmp 2
   !
   neighbor 192.0.2.1 remote-as 65000
   neighbor 192.0.2.1 description leaf1-Tenant-A
   !
   neighbor 192.0.2.3 remote-as 65000
   neighbor 192.0.2.3 description leaf2-Tenant-A
   !
   address-family ipv4
      neighbor 192.0.2.1 activate
      neighbor 192.0.2.3 activate
      network 203.0.113.0/24
!
end
