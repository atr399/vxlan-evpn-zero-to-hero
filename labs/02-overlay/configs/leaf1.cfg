hostname leaf1

feature ospf
feature bgp
feature nv overlay
nv overlay evpn
feature nv overlay
nv overlay evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.21/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP NVE source (used from Session 3)
  ip address 10.0.1.21/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description to spine1 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.1.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/2
  description to spine2 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.3.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/3
  description to host1 (unused in Session 2)
  shutdown

router ospf UNDERLAY
  router-id 10.0.0.21

router bgp 65000
  router-id 10.0.0.21
  address-family l2vpn evpn
  neighbor 10.0.0.11
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.0.0.12
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
