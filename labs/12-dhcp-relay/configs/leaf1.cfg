! Session 12 - DHCP Relay in the overlay (leaf1) - VERIFIED 2026-07-05
! Base: Model A chain 01 -> 04 (host1 plain-attached, no vPC)
feature dhcp
ip dhcp relay
! REQUIRED: source-interface relay DROPS all packets without these two
! lines ("Option 82 validation failed" counter increments). Verified.
ip dhcp relay information option
ip dhcp relay information option vpn

interface loopback99
  description Tenant-A DHCP relay giaddr - UNIQUE per leaf (NOT anycast!)
  vrf member Tenant-A
  ip address 10.99.99.1/32
! loopback99 is advertised automatically via the VRF's existing
! "redistribute direct route-map ALL_ROUTES" - no BGP change needed.

interface Vlan10
  ip dhcp relay address 10.100.20.10
  ip dhcp relay source-interface loopback99
