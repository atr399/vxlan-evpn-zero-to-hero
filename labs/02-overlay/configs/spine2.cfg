hostname spine2

feature ospf
feature bgp
feature nv overlay
nv overlay evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.12/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description to leaf1 Eth1/2
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.3.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/2
  description to leaf2 Eth1/2
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.4.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

router ospf UNDERLAY
  router-id 10.0.0.12

router bgp 65000
  router-id 10.0.0.12
  address-family l2vpn evpn
    retain route-target all
  neighbor 10.0.0.21
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.22
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
