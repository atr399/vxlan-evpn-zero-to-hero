hostname spine3

feature ospf
feature bgp
feature nv overlay
nv overlay evpn

interface loopback0
  description Router-ID and OSPF source
  ip address 10.0.0.13/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description to leaf3 Eth1/1
  no switchport
  mtu 9216
  no shutdown
  ip address 10.10.5.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/3
  description to IPN Eth3 (inter-pod underlay)
  no switchport
  mtu 9216
  no shutdown
  ip address 10.30.3.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

router ospf UNDERLAY
  router-id 10.0.0.13

router bgp 65000
  router-id 10.0.0.13
  address-family l2vpn evpn
    retain route-target all
  neighbor 10.0.0.23
    remote-as 65000
    update-source loopback0
    description to leaf3
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.11
    remote-as 65000
    update-source loopback0
    description to spine1 (Pod1)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
  neighbor 10.0.0.12
    remote-as 65000
    update-source loopback0
    description to spine2 (Pod1)
    address-family l2vpn evpn
      send-community
      send-community extended
      route-reflector-client
