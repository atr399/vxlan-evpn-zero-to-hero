# Session 17 - Load Balancer Insertion (one-armed vs inline) - UNTESTED
name: vxlan-evpn
topology:
  kinds:
    cisco_n9kv: { image: vrnetlab/cisco_n9kv:9300-10.5.5 }
  nodes:
    spine1: { kind: cisco_n9kv }
    spine2: { kind: cisco_n9kv }
    leaf1:  { kind: cisco_n9kv }
    leaf2:  { kind: cisco_n9kv }
    host1:  { kind: linux, image: alpine:latest }   # client, VLAN10 Ten-A
    lb:     { kind: linux, image: alpine:latest }   # haproxy, VLAN20 one-armed
    web1:   { kind: linux, image: alpine:latest }   # backend, VLAN20
    web2:   { kind: linux, image: alpine:latest }   # backend, VLAN20
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "lb:eth1"]
    - endpoints: ["leaf2:eth4", "web1:eth1"]
    - endpoints: ["leaf2:eth5", "web2:eth1"]
