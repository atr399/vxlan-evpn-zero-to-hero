name: vxlan-evpn

# Expanded topology supporting Sessions 1 through 11.
# Session 1-5: only the spine-leaf links and host1-leaf1, host2-leaf2 are used.
# Session 6+ adds: peer-link between leaves (Eth1/4) and host1's second uplink to leaf2 (Eth1/3).
# Session 8+ adds: external switch + host3 attached to leaf1 (L2Out demo).
# Extra links in earlier sessions are just unused (no traffic, no harm).

topology:
  kinds:
    cisco_n9kv:
      image: vrnetlab/cisco_n9kv:9300-10.5.5
    linux:
      image: alpine:latest

  nodes:
    spine1:
      kind: cisco_n9kv
    spine2:
      kind: cisco_n9kv
    leaf1:
      kind: cisco_n9kv
    leaf2:
      kind: cisco_n9kv
    host1:
      kind: linux
    host2:
      kind: linux
    external:
      kind: linux
      # External "switch" — actually a Linux container running a bridge.
      # Setup commands run in switch.sh when Session 8 is applied.
    host3:
      kind: linux
      # Behind the external switch — represents legacy workload outside the EVPN fabric.

  links:
    # Spine-leaf fabric (full mesh)
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]

    # Host attachments
    # host1's primary uplink (used by all sessions)
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    # host2's uplink (used by all sessions; single-homed for simplicity)
    - endpoints: ["leaf2:eth3", "host2:eth1"]

    # vPC additions (Session 6+)
    # Peer-link between the two leaves (carries vPC control + data)
    - endpoints: ["leaf1:eth4", "leaf2:eth4"]
    # Peer-keepalive — dedicated link for heartbeat (separate from peer-link)
    - endpoints: ["leaf1:eth5", "leaf2:eth5"]
    # host1's second uplink for the bond (used only in Session 6+)
    - endpoints: ["leaf2:eth6", "host1:eth2"]

    # L2Out additions (Session 8+)
    # External switch trunk to leaf1 (single-attached, no vPC for simplicity)
    - endpoints: ["leaf1:eth6", "external:eth1"]
    # External switch access port to host3
    - endpoints: ["external:eth2", "host3:eth1"]
